[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-quality-triage"
version = "0.1.0"
description = "Retrospective SECOM quality triage with evidence-grounded local briefs"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "scikit-learn==1.7.2",
  "streamlit==1.50.0", "plotly==6.3.1", "pydantic==2.11.9",
  "requests==2.32.5", "joblib==1.5.2", "pytest==8.4.2"
]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

